name: CI

on:
  push:
    branches: [master, beta, devel]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q panel proxy-register proxy-fake-traffic log-parser
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
